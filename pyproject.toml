[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evalenvelope"
version = "0.1.0"
description = "Finite paired benchmark completion certificates and prior-only acquisition plans"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EvalEnvelope contributors"}]
dependencies = []

[project.scripts]
evalenvelope = "evalenvelope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
